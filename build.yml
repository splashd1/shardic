name: Build VaultTool executables

# Builds standalone executables for Windows and Linux on every push to
# main and on manual trigger. This is the practical way to get a real
# Windows .exe without owning a Windows machine: PyInstaller can't
# cross-compile, but GitHub's windows-latest runners can build it for
# you. Download the artifacts from the workflow run's "Summary" page.
#
# To use: put these files in a GitHub repo at the paths shown, push,
# then check the Actions tab.
#   your-repo/
#     vault_core.py
#     vault_create.py
#     vault_recover.py
#     vault_gui.py
#     gf256_sss.py
#     wordgen.py
#     kdf.py
#     krypt_container.py
#     .github/workflows/build.yml   <- this file

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography argon2-cffi
      - name: Build GUI exe
        run: pyinstaller --onefile --windowed --name VaultTool-GUI vault_gui.py
      - name: Build CLI exes
        run: |
          pyinstaller --onefile --name vault-create vault_create.py
          pyinstaller --onefile --name vault-recover vault_recover.py
      - uses: actions/upload-artifact@v4
        with:
          name: VaultTool-windows-x64
          path: |
            dist/VaultTool-GUI.exe
            dist/vault-create.exe
            dist/vault-recover.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system + Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography argon2-cffi pillow
      - name: Build GUI binary
        run: pyinstaller --onefile --windowed --name VaultTool-GUI vault_gui.py
      - name: Build CLI binaries
        run: |
          pyinstaller --onefile --name vault-create vault_create.py
          pyinstaller --onefile --name vault-recover vault_recover.py
      - name: Package CLI AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VaultTool-linux-x64
          path: |
            dist/VaultTool-GUI
            dist/vault-create
            dist/vault-recover
            dist/VaultTool-x86_64.AppImage
